[package]
name = "truongphoto-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TruongPhoto desktop application"

[lib]
name = "truongphoto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
truongphoto-core = { workspace = true }
truongphoto-db = { workspace = true }
truongphoto-server = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
